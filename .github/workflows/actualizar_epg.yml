name: Actualizador Directo EPG (iptv-org)

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-epg:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar mi repositorio
      uses: actions/checkout@v4

    - name: Descargar motor scraper de iptv-org
      run: git clone --depth 1 https://github.com/iptv-org/epg.git scraper-core

    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Instalar dependencias del scraper
      run: |
        cd scraper-core
        npm install

    # 1. Scraping directo de los canales
    - name: Ejecutar scraping de canales
      run: |
        cp channels.xml scraper-core/my_channels.xml
        cd scraper-core
        npm run grab -- --channels=my_channels.xml --output=../epg.xml --maxConnections=2

    # 2. Acotamos las fechas hasta pasado mañana a las 05:59:59
    - name: Acotar EPG hasta las 05:59:59 de pasado mañana
      run: python recortar_epg.py

    # 3. NUEVO PASO: Comprimir el XML en formato .gz
    # -k (keep) conserva epg.xml intacto
    # -f (force) sobreescribe el .gz anterior si ya existía
    # -9 aplica el nivel de compresión máxima
    - name: Comprimir EPG en formato GZ
      run: gzip -k -9 -f epg.xml

    # 4. Guardar y subir ambos archivos (epg.xml y epg.xml.gz)
    - name: Guardar y subir archivos a GitHub
      run: |
        git config --global user.name "EPG AutoBot"
        git config --global user.email "bot@github.com"
        git add epg.xml epg.xml.gz
        git commit -m "EPG actualizada, acotada y comprimida [skip ci]" || exit 0
        git push
